name: Histórico B3 (reconstrução completa)

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos (ex.: 2019-2026)"
        required: true
        default: "2019-2026"

permissions:
  contents: write

concurrency:
  group: b3-opcoes
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruir histórico
        run: python3 tools/b3_historico.py --anos ${{ inputs.anos }} | tee historico-log.txt
      - name: Publicar
        run: |
          mkdir -p historico && mv historico-log.txt historico/ultimo-log.txt
          git config user.name "atlas-dados bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico
          git commit -m "Histórico B3 — reconstrução ${{ inputs.anos }}" || echo "Nada novo."
          git push
