name: Opções B3 (arquivo oficial diário)

on:
  schedule:
    # 20:40 e 23:40 de Brasília em dias úteis, e 06:40 do dia seguinte (o arquivo da B3
    # costuma sair à noite; as execuções seguintes só publicam se ainda faltar o pregão).
    - cron: "40 23 * * 1-5"
    - cron: "40 2 * * 2-6"
    - cron: "40 9 * * 2-6"
  workflow_dispatch:
    inputs:
      data:
        description: "Pregão (aaaa-mm-dd); vazio = último disponível"
        required: false
      sondar:
        description: "Sondar a API do Boletim Diário (posições em aberto)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: b3-opcoes
  cancel-in-progress: false

jobs:
  opcoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar e extrair COTAHIST
        run: python3 tools/b3_opcoes.py ${{ github.event.inputs.data }}
      - name: Fluxo de investidor estrangeiro (Dados de Mercado da B3)
        continue-on-error: true
        run: python3 tools/b3_estrangeiro.py
      - name: Acrescentar o pregão ao histórico (backtest e IV rank)
        continue-on-error: true
        run: python3 tools/b3_historico.py --dia ${{ github.event.inputs.data }}
      - name: Sensibilidades medidas (juros, dólar, petróleo, mercado)
        continue-on-error: true
        run: python3 tools/b3_fatores.py | tee fatores-log.txt && mkdir -p fatores && mv fatores-log.txt fatores/ultimo-log.txt
      - name: Sondar Boletim Diário
        if: ${{ inputs.sondar }}
        continue-on-error: true
        run: python3 tools/b3_sondar.py ${{ github.event.inputs.data }}
      - name: Sondar fluxo estrangeiro
        if: ${{ inputs.sondar }}
        continue-on-error: true
        run: python3 tools/b3_sondar_estrangeiro.py
      - name: Sondar séries de fatores
        if: ${{ inputs.sondar }}
        continue-on-error: true
        run: python3 tools/b3_sondar_fatores.py
      - name: Publicar
        run: |
          if [ -n "$(git status --porcelain opcoes sondagem historico estrangeiro fatores)" ]; then
            git config user.name "atlas-dados bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add opcoes; for d in sondagem historico estrangeiro fatores; do [ -d "$d" ] && git add "$d"; done; true
            git commit -m "Opções B3 — $(python3 -c "import json;print(json.load(open('opcoes/latest.json'))['date'])")"
            git push
          else
            echo "Nada novo para publicar."
          fi
